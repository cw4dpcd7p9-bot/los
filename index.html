<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LOS</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="map"></div>
  <div class="frame"></div>
  <div class="hud">
    <div class="top">
      <div class="brand">LOS <span>MAP</span></div>
      <div class="street">
        <div id="street">locating</div>
        <small id="place">allow location · click to mark</small>
      </div>
    </div>
    <form class="search" onsubmit="return false">
      <input id="q" type="search" placeholder="/ SEARCH" autocomplete="off" />
      <div class="results" id="results"></div>
    </form>
    <div class="hint" id="hint">CLICK MAP TO SET WAYPOINT</div>
    <div class="arrive" id="arrive">ARRIVED</div>
    <div class="radar-wrap" id="radar-wrap">
      <div class="radar-rose" id="rose"><i>N</i></div>
      <div class="radar"><div id="radar"></div></div>
    </div>
    <div class="tape">
      <div class="maneuver" id="maneuver">
        <div class="next" id="maneuver-text">NO WAYPOINT</div>
        <div class="sub" id="maneuver-sub">one destination. nothing else.</div>
      </div>
      <div class="stats">
        <div class="stat"><b id="spd">0</b><span>MPH</span></div>
        <div class="stat"><b id="eta">—</b><span>ETA</span></div>
        <div class="stat"><b id="dist">—</b><span>DIST</span></div>
      </div>
    </div>
    <div class="tools">
      <button type="button" id="btn-follow" class="on">YOU</button>
      <button type="button" id="btn-cam">CAM</button>
      <button type="button" id="btn-sat">SAT</button>
      <button type="button" id="btn-mode">CAR</button>
      <button type="button" id="btn-voice">VOX</button>
      <button type="button" id="btn-alt">ALT</button>
      <button type="button" id="btn-in">+</button>
      <button type="button" id="btn-out">−</button>
      <button type="button" id="btn-share">LNK</button>
      <button type="button" id="btn-clear">CLR</button>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="./app.js"></script>
</body>
</html>
